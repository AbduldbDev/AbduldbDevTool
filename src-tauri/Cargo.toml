[package]
name = "abduldbdev-project-manager"
version = "0.1.0"
description = "AbduldbDev Project Manager"
authors = ["AbduldbDev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.7.0"
chrono = "0.4"

[[bin]]
name = "abduldbdev-project-manager"
path = "src/main.rs"
