
[package]
name = "abduldbdevtool"
version = "0.1.0"
description = "AbduldbDev Project Manager"
authors = ["AbduldbDev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "shell-open", "fs-all", "dialog-all", "updater"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
